<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Асока Тано — Jedi Series</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-dark-card: rgba(28, 28, 30, 0.94);
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-secondary: #8E8E93;
        }

        body {
            margin: 0; padding: 0;
            background-color: #3C7FFB;
            font-family: -apple-system, SF Pro Display, system-ui, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Область галереи */
        .gallery-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gallery-container {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-container::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .slide img {
            max-width: 85%;
            max-height: 75%;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.4));
        }

        /* Индикаторы страниц (динамические) */
        .pagination {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .dot {
            width: 7px; height: 7px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: white;
            transform: scale(1.3);
        }

        /* Нижняя карточка */
        .details-card {
            background: var(--ios-dark-card);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 0.5px solid var(--ios-border);
            border-radius: 32px 32px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            box-shadow: 0 -15px 40px rgba(0,0,0,0.3);
        }

        .header-section h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; letter-spacing: -1px; }
        .rating-row { display: flex; align-items: center; gap: 6px; font-size: 14px; margin-bottom: 24px; }
        .stars { color: #FFD60A; }
        
        .ios-list { background: rgba(255, 255, 255, 0.06); border-radius: 14px; overflow: hidden; }
        .ios-item { display: flex; justify-content: space-between; padding: 14px 16px; border-bottom: 0.5px solid var(--ios-border); }
        .ios-item:last-child { border-bottom: none; }
        .label { color: var(--ios-secondary); }
        .blue-accent { color: var(--ios-blue); font-weight: 600; }
    </style>
</head>
<body>

    <div class="gallery-wrapper">
        <div class="gallery-container" id="slider"></div>
        <div class="pagination" id="dots-container"></div>
    </div>

    <div class="details-card">
        <div class="header-section">
            <h1>Асока Тано</h1>
            <div class="rating-row">
                <span class="stars">★★★★★</span>
                <span class="reviews-text">24 отзыва</span>
            </div>
        </div>

        <div class="ios-list">
            <div class="ios-item"><span class="label">Артикул</span><span class="value">#LF-237512-02</span></div>
            <div class="ios-item"><span class="label">Серия</span><span class="value">Джедаи</span></div>
            <div class="ios-item"><span class="label">Доставка</span><span class="blue-accent">27 февраля</span></div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#3C7FFB');

        // 1. ПРОСТО ПЕРЕЧИСЛИ ИМЕНА КАРТИНКЕ ЗДЕСЬ
        const images = ["IMG_2090.webp", "IMG_2091.webp", "IMG_2092.webp", "IMG_2093.webp"];
        const folder = "Pics/fig2/";

        const slider = document.getElementById('slider');
        const dotsContainer = document.getElementById('dots-container');

        // 2. ГЕНЕРИРУЕМ ВЕРСТКУ АВТОМАТИЧЕСКИ
        images.forEach((imgName, index) => {
            // Создаем слайд
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.innerHTML = `<img src="${folder}${imgName}" alt="Photo ${index + 1}">`;
            slider.appendChild(slide);

            // Создаем точку
            const dot = document.createElement('div');
            dot.className = index === 0 ? 'dot active' : 'dot';
            dotsContainer.appendChild(dot);
        });

        // 3. ЛОГИКА СКРОЛЛА
        const dots = document.querySelectorAll('.dot');
        let currentIdx = 0;

        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / window.innerWidth);
            if (index !== currentIdx && index < images.length) {
                currentIdx = index;
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                dots.forEach((dot, i) => dot.classList.toggle('active', i === currentIdx));
            }
        });
    </script>
</body>
</html>
