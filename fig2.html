<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Асока Тано — Jedi Series</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-dark-card: rgba(28, 28, 30, 0.94);
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-secondary: #8E8E93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #3C7FFB;
            font-family: -apple-system, SF Pro Display, system-ui, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .gallery-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .gallery-container {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .gallery-container::-webkit-scrollbar {
            display: none;
        }

        .slide {
            flex: 0 0 100%;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .slide img {
            max-width: 85%;
            max-height: 75%;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.4));
        }

        .pagination {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dot.active {
            background: white;
            transform: scale(1.3);
        }

        .details-card {
            background: var(--ios-dark-card);
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
            border-top: 0.5px solid var(--ios-border);
            border-radius: 32px 32px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            box-shadow: 0 -15px 40px rgba(0,0,0,0.3);
        }

        .header-section {
            margin-bottom: 24px;
        }

        .header-section h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 6px 0;
            letter-spacing: -1px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }

        .stars { color: #FFD60A; }
        .reviews-text { color: var(--ios-secondary); font-weight: 400; }

        .ios-list {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            overflow: hidden;
        }

        .ios-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--ios-border);
            font-size: 16px;
        }

        .ios-item:last-child { border-bottom: none; }
        .label { color: var(--ios-secondary); font-weight: 400; }
        .value { font-weight: 400; }
        .blue-accent { color: var(--ios-blue); font-weight: 600; }

    </style>
</head>
<body>

    <div class="gallery-wrapper">
        <div class="gallery-container" id="slider">
            <div class="slide"><img src="Pics/fig2/IMG_2087.webp" alt="Photo 1"></div>
            <div class="slide"><img src="Pics/fig2/IMG_2088.webp" alt="Photo 2"></div>
            <div class="slide"><img src="Pics/fig2/IMG_2089.webp" alt="Photo 3"></div>
            <div class="slide"><img src="Pics/fig2/IMG_2090.webp" alt="Photo 4"></div>
        </div>
        
        <div class="pagination" id="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="details-card">
        <div class="header-section">
            <h1>Асока Тано</h1>
            <div class="rating-row">
                <span class="stars">★★★★★</span>
                <span class="reviews-text">18 отзывов</span>
            </div>
        </div>

        <div class="ios-list">
            <div class="ios-item">
                <span class="label">Артикул</span>
                <span class="value">#LF-237512-02</span>
            </div>
            <div class="ios-item">
                <span class="label">Серия</span>
                <span class="value">Джедаи</span>
            </div>
            <div class="ios-item">
                <span class="label">Доставка</span>
                <span class="blue-accent">25 февраля</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
        tg.setHeaderColor('#3C7FFB');

        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot');
        let currentIdx = 0;

        slider.addEventListener('scroll', () => {
            const index = Math.round(slider.scrollLeft / window.innerWidth);
            if (index !== currentIdx) {
                currentIdx = index;
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                dots.forEach((dot, i) => {
                    dot.classList.toggle('active', i === currentIdx);
                });
            }
        });
    </script>
</body>
</html>
