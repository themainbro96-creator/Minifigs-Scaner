<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Protocol: Access</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            /* Базовые переменные из темы Telegram */
            --bg: var(--tg-theme-bg-color, #ffffff);
            --text: var(--tg-theme-text-color, #000000);
            --hint: var(--tg-theme-hint-color, #999999);
            --accent: var(--tg-theme-button-color, #007aff);
            --accent-text: var(--tg-theme-button-text-color, #ffffff);
            --secondary-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
            transition: filter 0.3s ease, background-color 0.3s ease;
        }

        /* Состояние блюра при загрузке */
        body.loading-blur {
            filter: blur(8px);
            pointer-events: none;
        }

        #main-screen, #success-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        #success-screen { display: none; }

        .emoji-header {
            font-size: 80px;
            margin-bottom: 30px;
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; color: var(--text); }
        p { font-size: 16px; opacity: 0.7; max-width: 280px; line-height: 1.4; margin: 0 0 40px; color: var(--text); }

        /* Поля ввода кода - сумма длин равна 280px */
        .code-container {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            width: 280px;
            justify-content: center;
        }

        .code-input {
            width: 40px;
            height: 52px;
            border: 2px solid transparent;
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            background: var(--secondary-bg);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }

        .code-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .btn-main {
            background-color: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 18px 0;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
            transition: transform 0.1s active;
        }

        .btn-main:active {
            transform: scale(0.98);
            opacity: 0.9;
        }

        /* Лоадер в стиле Google */
        #loader-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(120, 120, 120, 0.1);
            border-left-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Адаптация для темной темы ТГ (если инпуты слишком светлые) */
        @media (prefers-color-scheme: dark) {
            .code-input { background: rgba(255, 255, 255, 0.1); }
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="emoji-header">🚀</div>
        <h1>Введи код</h1>
        <p>Введи код для получения фигурки. Ты можешь получить его у куратора, когда закончишь выполнение заданий!</p>
        
        <div class="code-container" id="otp-inputs">
            <input type="tel" maxlength="1" class="code-input">
            <input type="tel" maxlength="1" class="code-input">
            <input type="tel" maxlength="1" class="code-input">
            <input type="tel" maxlength="1" class="code-input">
            <input type="tel" maxlength="1" class="code-input">
            <input type="tel" maxlength="1" class="code-input">
        </div>

        <button class="btn-main" id="submit-btn" onclick="checkCode()">Продолжить</button>
    </div>

    <div id="success-screen">
        <div class="emoji-header">🎉</div>
        <h1>Ура!</h1>
        <p>Все задания выполнены! Чтобы получить свою фигурку, обратись к куратору и покажи ему этот экран.<br><br><b>Возвращайся завтра!</b></p>
    </div>

    <div id="loader-overlay">
        <div class="spinner"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        const validCodes = ["567132", "541987", "352987"];
        const isAdmin = tg.initDataUnsafe?.user?.username === 'ya_admin7';
        
        const inputs = document.querySelectorAll('.code-input');

        // Логика автопереключения инпутов
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                if (e.target.value.length === 1 && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    inputs[index - 1].focus();
                }
            });
        });

        function checkCode() {
            const enteredCode = Array.from(inputs).map(i => i.value).join('');
            
            if (validCodes.includes(enteredCode)) {
                processSuccess();
            } else {
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                inputs.forEach(i => {
                    i.style.borderColor = '#ff3b30';
                    setTimeout(() => i.style.borderColor = 'transparent', 500);
                });
            }
        }

        function processSuccess() {
            // Блюр и легкая вибрация
            document.body.classList.add('loading-blur');
            document.getElementById('loader-overlay').style.display = 'flex';
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            setTimeout(() => {
                // Двойная вибрация успеха
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                
                document.body.classList.remove('loading-blur');
                document.getElementById('loader-overlay').style.display = 'none';
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'flex';

                // Сохраняем состояние (кроме админа)
                if (!isAdmin) {
                    const today = new Date().toDateString();
                    localStorage.setItem('protocol_unlocked_date', today);
                }

                // Блестки
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: [tg.themeParams.button_color || '#3C7FFB', '#ffffff', '#000000']
                });

            }, 700);
        }

        window.onload = () => {
            const savedDate = localStorage.getItem('protocol_unlocked_date');
            const today = new Date().toDateString();

            if (!isAdmin && savedDate === today) {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('success-screen').style.display = 'flex';
            }
        };

    </script>
</body>
</html>
