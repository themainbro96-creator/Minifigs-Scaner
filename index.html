<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Главная страница — без изменений */
        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.3s ease;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        /* Контейнер сканера */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
        }

        /* Стилизация стандартной рамки библиотеки */
        #reader__scan_region div {
            border-radius: 30px !important; /* Скругляем углы стандартного квадрата */
            border-width: 4px !important;
        }

        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            z-index: 1001;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="initScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function initScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.getElementById('main-screen').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('scanner-wrapper').style.display = 'block';

                html5QrCode = new Html5Qrcode("reader");
                
                // Рассчитываем размер квадрата: 70% от меньшей стороны экрана
                const qrBoxSize = (viewfinderWidth, viewfinderHeight) => {
                    let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    let size = Math.floor(minEdge * 0.7);
                    return { width: size, height: size };
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    { 
                        fps: 20, 
                        qrbox: qrBoxSize,
                        aspectRatio: 1.0 
                    }, 
                    (decodedText) => {
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        // Сразу переходим по ссылке
                        window.location.href = decodedText;
                    }
                ).catch(err => {
                    console.error("Scanner error:", err);
                    stopScanner();
                });
            }, 350);
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    resetUI();
                }).catch(() => resetUI());
            } else {
                resetUI();
            }
        }

        function resetUI() {
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('main-screen').style.opacity = '1';
        }
    </script>
</body>
</html>
