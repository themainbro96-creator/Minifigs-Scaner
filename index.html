<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
            --tg-theme-hint-color: #999;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            overflow: hidden;
        }

        /* Главный экран */
        #main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            transition: opacity 0.3s;
        }

        .holder-img {
            width: 180px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            margin: 0 0 8px 0;
            font-weight: 600;
        }

        p {
            font-size: 15px;
            color: var(--tg-theme-text-color);
            opacity: 0.75;
            max-width: 260px;
            margin: 0 0 40px 0;
            line-height: 1.4;
        }

        .tg-button {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 600;
            width: 260px;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .tg-button:active {
            transform: scale(0.96);
        }

        /* Экран сканера */
        #scanner-container {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #000;
            z-index: 100;
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        /* Сетка сканера (iOS style) */
        .overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .scan-region {
            width: 250px;
            height: 250px;
            position: relative;
            box-shadow: 0 0 0 1000px rgba(0,0,0,0.6); /* Затемнение */
        }

        /* Углы */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-radius: 15px;
        }
        .tl { top: -2px; left: -2px; border-right: 0; border-bottom: 0; }
        .tr { top: -2px; right: -2px; border-left: 0; border-bottom: 0; }
        .bl { bottom: -2px; left: -2px; border-right: 0; border-top: 0; }
        .br { bottom: -2px; right: -2px; border-left: 0; border-top: 0; }

        /* Кнопка галереи (iOS style) */
        .gallery-btn {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: all;
            border: none;
        }

        .gallery-btn svg {
            fill: #fff;
            width: 28px;
            height: 28px;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <img src="Pics/BlackHolder.png" alt="Holder" class="holder-img">
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="tg-button" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-container">
        <div id="reader"></div>
        <div class="overlay">
            <div class="scan-region">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
        </div>
        <button class="gallery-btn" onclick="document.getElementById('file-input').click()">
            <svg viewBox="0 0 24 24"><path d="M19,5V19H5V5H19M19,3H5C3.9,3 3,3.9 3,5V19C3,20.1 3.9,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M13.96,12.29L11.21,15.83L9.25,13.47L6.5,17H17.5L13.96,12.29Z"/></svg>
        </button>
        <input type="file" id="file-input" accept="image/*" style="display:none" onchange="scanFile(this)">
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Применяем цвета темы
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.backgroundColor);
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.textColor);
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color);
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color);

        let html5QrCode;

        function startScanner() {
            // Вибрация
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            document.getElementById('main-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('scanner-container').style.display = 'block';
                
                html5QrCode = new Html5Qrcode("reader");
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    onScanSuccess
                );
            }, 300);
        }

        function onScanSuccess(decodedText) {
            // Вибрация при успехе
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            // Переходим по ссылке (наши fig1.html и т.д.)
            window.location.href = decodedText;
        }

        function scanFile(input) {
            if (input.files.length === 0) return;
            const file = input.files[0];
            const reader = new Html5Qrcode("reader");
            reader.scanFile(file, true)
                .then(onScanSuccess)
                .catch(err => {
                    alert("QR-код не найден на фото");
                });
        }
    </script>
</body>
</html>
