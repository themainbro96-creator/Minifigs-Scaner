<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-button-color: #3C7FFB;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .holder-img {
            width: 220px;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG');
        }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 18px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            width: 280px;
        }

        /* ЭКРАН СКАНЕРА */
        #scanner-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ВООБЩЕ НЕВИДИМЫЙ КВАДРАТ (только тень вокруг) */
        .scan-window {
            width: 260px;
            height: 260px;
            border-radius: 40px;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.6); /* Затемнение */
            border: none; /* Абсолютно невидимый */
        }

        .scan-label {
            margin-top: 20px;
            color: #fff;
            font-size: 16px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p style="opacity: 0.6; margin-bottom: 40px;">Наведи камеру на центр экрана</p>
        <button class="btn-main" onclick="startCamera()">Сканировать</button>
    </div>

    <div id="scanner-container">
        <video id="video-preview" playsinline></video>
        <canvas id="scan-canvas" style="display:none;"></canvas>
        <div id="overlay">
            <div class="scan-window"></div>
            <div class="scan-label">Наведи камеру на центр экрана</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('scan-canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        let scanning = false;

        async function startCamera() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-container').style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", focusMode: "continuous" } 
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                scanning = true;
                requestAnimationFrame(tick);
            } catch (err) {
                alert("Ошибка камеры: " + err);
                location.reload();
            }
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    scanning = false;
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    // Останавливаем поток
                    video.srcObject.getTracks().forEach(track => track.stop());
                    
                    // Переходим по ссылке
                    window.location.href = code.data;
                    return;
                }
            }
            if (scanning) requestAnimationFrame(tick);
        }
    </script>
</body>
</html>
