<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Главная страница */
        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        /* Контейнер сканера */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #reader { width: 100%; height: 100%; }

        /* ХАК ДЛЯ СТИЛИЗАЦИИ ВНУТРЕННЕЙ РАМКИ БИБЛИОТЕКИ */
        #reader__scan_region {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Делаем саму рамку библиотеки белым квадратом с закруглением */
        #reader__dashboard_section_csr div[style*="border: 5px solid rgb(255, 255, 255)"], 
        #reader__scan_region div {
            border: 3px solid #fff !important;
            border-radius: 40px !important;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6) !important; /* Затемнение вокруг */
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Анимация сужения при сканировании */
        .shrinking {
            transform: scale(0.4);
            opacity: 0;
        }

        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="initScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function initScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const main = document.getElementById('main-screen');
            const wrap = document.getElementById('scanner-wrapper');

            main.style.opacity = '0';
            setTimeout(() => {
                main.style.display = 'none';
                wrap.style.display = 'block';
                setTimeout(() => wrap.style.opacity = '1', 50);

                html5QrCode = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 25, 
                    // Библиотека сама нарисует квадрат этого размера
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0 
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        // Находим рамку внутри библиотеки и сжимаем её
                        const region = document.querySelector('#reader__scan_region div');
                        if(region) region.classList.add('shrinking');
                        
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        
                        setTimeout(() => {
                            window.location.href = decodedText;
                        }, 400);
                    }
                ).catch(err => {
                    console.error("Camera error:", err);
                    stopScanner();
                });
            }, 400);
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    showMain();
                }).catch(() => showMain());
            } else {
                showMain();
            }
        }

        function showMain() {
            const main = document.getElementById('main-screen');
            const wrap = document.getElementById('scanner-wrapper');
            wrap.style.opacity = '0';
            setTimeout(() => {
                wrap.style.display = 'none';
                main.style.display = 'flex';
                setTimeout(() => main.style.opacity = '1', 50);
            }, 400);
        }
    </script>
</body>
</html>
