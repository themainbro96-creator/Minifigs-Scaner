<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        #scanner-wrapper {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 1000;
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        /* Полное подавление внутреннего интерфейса библиотеки */
        #reader__scan_region {
            /* Убираем любые системные рамки, которые рисует библиотека */
            border: none !important;
        }
        
        #reader__scan_region div {
            border: none !important; /* Убираем даже прозрачные границы */
        }

        #reader video {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important; 
        }

        /* Наш оверлей */
        #custom-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 250px;
            height: 250px;
            /* ВООБЩЕ невидимый квадрат */
            border: none !important; 
            background: transparent;
            position: relative;
            /* Затемнение экрана вокруг центральной зоны */
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65);
        }

        .scan-text {
            position: absolute;
            bottom: -60px;
            left: 0; width: 100%;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* Прячем служебные элементы */
        #reader__dashboard_section_csr,
        #reader__dashboard_section_swaplink,
        #reader img {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div id="custom-overlay">
            <div class="scan-frame">
                <div class="scan-text">Наведи камеру на центр экрана</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function startScanner() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 25, 
                // Устанавливаем зону поиска кода (квадрат по центру)
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.0
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    
                    html5QrCode.stop().then(() => {
                        window.location.href = decodedText;
                    }).catch(() => {
                        window.location.href = decodedText;
                    });
                },
                (errorMessage) => {
                    // Игнорируем ошибки сканирования пустых кадров
                }
            ).catch((err) => {
                console.error("Camera access error:", err);
                resetToMain();
                alert("Пожалуйста, разрешите доступ к камере.");
            });
        }

        function resetToMain() {
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
