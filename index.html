<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Начальный экран */
        #main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            /* Исправлено под твой регистр в GitHub */
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Контейнер сканера */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }

        #reader { width: 100%; height: 100%; }

        /* Оверлей сканера */
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Та самая рамка */
        .reticle {
            width: 260px;
            height: 260px;
            position: relative;
            /* Создаем эффект "дырки" в центре */
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.7);
            border-radius: 40px;
        }

        .reticle::before, .reticle::after, .reticle .inner-c::before, .reticle .inner-c::after {
            content: "";
            position: absolute;
            width: 50px;
            height: 50px;
            border-color: #fff;
            border-style: solid;
            border-width: 0;
        }

        /* Рисуем ровные уголки */
        .reticle::before { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 30px; }
        .reticle::after { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 30px; }
        .inner-c::before { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 30px; }
        .inner-c::after { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 30px; }

        .scan-hint {
            color: #fff;
            margin-top: 40px;
            font-size: 15px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* Кнопка закрытия */
        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="initScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="reticle">
                <div class="inner-c" style="width:100%; height:100%; position:relative;"></div>
            </div>
            <div class="scan-hint">Помести код в квадрат</div>
        </div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let scanner = null;

        function initScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            scanner = new Html5Qrcode("reader");
            
            const config = { 
                fps: 20, 
                qrbox: { width: 260, height: 260 },
                aspectRatio: 1.0
            };

            scanner.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    // Автоматический переход при наведении
                    window.location.href = decodedText;
                }
            ).catch(err => {
                alert("Ошибка камеры: " + err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (scanner) {
                scanner.stop().then(() => {
                    document.getElementById('scanner-wrapper').style.display = 'none';
                    document.getElementById('main-screen').style.display = 'flex';
                });
            }
        }
    </script>
</body>
</html>
