<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Главная страница — НЕЛЬЗЯ УРЕЗАТЬ */
        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* Контейнер сканера */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #reader { width: 100%; height: 100%; }
        #reader video { object-fit: cover !important; }

        /* Оверлей сканера */
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            box-shadow: inset 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }

        /* Только уголки */
        .reticle {
            width: 260px;
            height: 260px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Анимация сужения при успехе */
        .reticle.success {
            width: 100px;
            height: 100px;
            opacity: 0;
        }

        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            border-radius: 12px;
        }

        .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-right-radius: 0; border-bottom-left-radius: 0; }
        .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-left-radius: 0; border-bottom-right-radius: 0; }
        .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-right-radius: 0; border-top-left-radius: 0; }
        .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-left-radius: 0; border-top-right-radius: 0; }

        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            pointer-events: all;
            z-index: 1001;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="initScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scan-overlay">
            <div class="reticle" id="reticle">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
        </div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function initScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            const main = document.getElementById('main-screen');
            const wrap = document.getElementById('scanner-wrapper');

            main.style.opacity = '0';
            main.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                main.style.display = 'none';
                wrap.style.display = 'block';
                setTimeout(() => wrap.style.opacity = '1', 50);

                html5QrCode = new Html5Qrcode("reader");
                
                const config = { 
                    fps: 25, 
                    qrbox: { width: 260, height: 260 },
                    aspectRatio: 1.0 
                };

                html5QrCode.start(
                    { facingMode: "environment" }, 
                    config, 
                    (decodedText) => {
                        // Эффект сужения углов
                        document.getElementById('reticle').classList.add('success');
                        
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        
                        // Небольшая задержка для анимации сужения
                        setTimeout(() => {
                            window.location.href = decodedText;
                        }, 300);
                    }
                ).catch(err => {
                    console.error("Camera error:", err);
                    stopScanner();
                });
            }, 400);
        }

        function stopScanner() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    showMain();
                }).catch(() => showMain());
            } else {
                showMain();
            }
        }

        function showMain() {
            const main = document.getElementById('main-screen');
            const wrap = document.getElementById('scanner-wrapper');
            const ret = document.getElementById('reticle');

            wrap.style.opacity = '0';
            ret.classList.remove('success');
            
            setTimeout(() => {
                wrap.style.display = 'none';
                main.style.display = 'flex';
                setTimeout(() => {
                    main.style.opacity = '1';
                    main.style.transform = 'scale(1)';
                }, 50);
            }, 400);
        }
    </script>
</body>
</html>
