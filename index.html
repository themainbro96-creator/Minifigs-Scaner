<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            /* Убираем системные подсветки при тапе */
            -webkit-tap-highlight-color: transparent; 
        }

        /* =========================================
           ГЛАВНЫЙ ЭКРАН
           ========================================= */
        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        /* Контейнер для кнопок */
        .button-group {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 280px;
        }

        /* iOS 26 Мармеладные кнопки */
        .btn-main, .btn-gallery {
            position: relative;
            background-color: var(--tg-theme-button-color);
            border: none;
            border-radius: 30px; /* Круглые углы (Pill) */
            cursor: pointer;
            overflow: hidden;
            /* Плавная анимация возврата формы */
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s ease;
            transform-origin: center;
        }

        .btn-main {
            flex: 1;
            color: var(--tg-theme-button-text-color);
            padding: 16px 0;
            font-size: 17px;
            font-weight: 600;
        }

        .btn-gallery {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .btn-gallery img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
            position: relative;
            z-index: 2;
        }
        
        .btn-main span {
            position: relative;
            z-index: 2;
        }

        /* Свечение под пальцем (Liquid Glow) */
        .btn-main::before, .btn-gallery::before {
            content: '';
            position: absolute;
            top: var(--y, 50%);
            left: var(--x, 50%);
            width: 150%;
            height: 150%;
            background: radial-gradient(circle closest-side, rgba(255, 255, 255, 0.3), transparent);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.3s ease, opacity 0.3s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 1;
        }

        .btn-main.is-active::before, .btn-gallery.is-active::before {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
        }

        /* =========================================
           ЭКРАН СКАНЕРА
           ========================================= */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 1000;
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #custom-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        .scan-frame {
            width: 250px;
            height: 250px;
            border: none !important;
            border-radius: 40px; /* Более скругленная рамка */
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65);
        }

        .scan-text {
            position: absolute;
            bottom: -50px;
            left: 0; width: 100%;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* iOS 26 Всплывающая плашка ссылки (Liquid Glass) */
        #link-popup {
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translate(-50%, 40px) scale(0.95);
            opacity: 0;
            pointer-events: none;
            
            /* Эффект стекла */
            background: rgba(40, 40, 40, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            
            padding: 14px 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 500;
            max-width: 80%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); /* Пружинистая анимация iOS */
            z-index: 1001;
        }

        #link-popup.show {
            transform: translate(-50%, 0) scale(1);
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
        }

        .popup-icon {
            width: 20px;
            height: 20px;
            background-color: #0a84ff; /* Яркий iOS синий акцент */
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        
        .popup-icon svg {
            width: 12px;
            height: 12px;
            fill: #fff;
        }

        .popup-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #file-input { display: none; }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        
        <div class="button-group">
            <button class="btn-main" onclick="startScanner()"><span>Сканировать</span></button>
            <button class="btn-gallery" onclick="document.getElementById('file-input').click()">
                <img src="https://cdn-icons-png.flaticon.com/512/3342/3342176.png" alt="Gallery">
            </button>
        </div>
        <input type="file" id="file-input" accept="image/*" onchange="scanFromFile(event)">
    </div>

    <div id="scanner-wrapper">
        <video id="video-preview" playsinline></video>
        <canvas id="scan-canvas" style="display:none;"></canvas>
        
        <div id="custom-overlay">
            <div class="scan-frame">
                <div class="scan-text">Помести код в центр экрана</div>
            </div>
        </div>

        <div id="link-popup">
            <div class="popup-icon">
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </div>
            <div class="popup-text" id="link-popup-text">Сайт</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('scan-canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        let scanning = false;
        let scannedUrl = "";

        // Обработка кнопки Back
        tg.BackButton.onClick(() => {
            stopScanner();
        });

        // 1. Скан с камеры
        async function startScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';
            document.getElementById('link-popup').classList.remove('show');
            tg.BackButton.show();

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                scanning = true;
                requestAnimationFrame(tick);
            } catch (err) {
                alert("Ошибка камеры.");
                stopScanner();
            }
        }

        function stopScanner() {
            scanning = false;
            tg.BackButton.hide();
            document.getElementById('link-popup').classList.remove('show');
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });

                if (code) {
                    showLinkPopup(code.data);
                    return; // Приостанавливаем сканирование пока висит плашка
                }
            }
            if (scanning) requestAnimationFrame(tick);
        }

        // 2. Скан из файла (галерея)
        function scanFromFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    canvas.width = img.width;
                    canvas.height = img.height;
                    context.drawImage(img, 0, 0);
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height);
                    
                    if (code) {
                        // Если скан из галереи, сразу переходим, так как плашка на главном экране не нужна
                        if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                        window.location.href = code.data;
                    } else {
                        alert("QR-код на фото не найден. Попробуйте другое фото.");
                    }
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 3. Логика всплывающей плашки (вместо мгновенного перехода)
        function showLinkPopup(url) {
            scanning = false; // Ставим сканер на паузу
            scannedUrl = url;
            
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            const popup = document.getElementById('link-popup');
            const popupText = document.getElementById('link-popup-text');
            
            // Пытаемся достать домен для красивого отображения, иначе показываем как есть
            try {
                const urlObj = new URL(url);
                popupText.innerText = urlObj.hostname;
            } catch(e) {
                popupText.innerText = url;
            }

            popup.classList.add('show');
        }

        // Клик по всплывающей плашке
        document.getElementById('link-popup').addEventListener('click', () => {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            window.location.href = scannedUrl;
        });

        // 4. Логика "Мармеладных" кнопок (Деформация и свечение)
        const buttons = document.querySelectorAll('.btn-main, .btn-gallery');
        
        buttons.forEach(btn => {
            let isDown = false;

            const handleMove = (e) => {
                if (!isDown) return;
                const rect = btn.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const x = clientX - rect.left;
                const y = clientY - rect.top;

                // Передаем координаты для свечения
                btn.style.setProperty('--x', `${x}px`);
                btn.style.setProperty('--y', `${y}px`);

                // Вычисляем легкую деформацию (смещение от центра)
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const deltaX = (x - centerX) / centerX; // От -1 до 1
                const deltaY = (y - centerY) / centerY;

                // Маленькая деформация + slight scale
                btn.style.transform = `scale(1.02) translate(${deltaX * 3}px, ${deltaY * 3}px)`;
            };

            const handleDown = (e) => {
                isDown = true;
                btn.classList.add('is-active');
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); // Легкая вибрация при касании
                btn.style.transform = `scale(1.02)`;
                handleMove(e); // Сразу вычисляем позицию свечения
            };

            const handleUp = () => {
                isDown = false;
                btn.classList.remove('is-active');
                btn.style.transform = `scale(1) translate(0px, 0px)`;
            };

            // Сенсорные события
            btn.addEventListener('touchstart', handleDown, {passive: true});
            btn.addEventListener('touchmove', handleMove, {passive: true});
            btn.addEventListener('touchend', handleUp);
            btn.addEventListener('touchcancel', handleUp);

            // События мыши (для десктопа/тестов)
            btn.addEventListener('mousedown', handleDown);
            btn.addEventListener('mousemove', handleMove);
            btn.addEventListener('mouseup', handleUp);
            btn.addEventListener('mouseleave', handleUp);
        });

    </script>
</body>
</html>
