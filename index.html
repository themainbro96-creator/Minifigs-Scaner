<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
        }

        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }

        #reader { width: 100%; height: 100%; }

        .scan-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        /* Контейнер рамки */
        .reticle {
            width: 260px;
            height: 260px;
            position: relative;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.7);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); /* Для анимации сужения */
        }

        /* Анимация при захвате */
        .reticle.active {
            width: 150px;
            height: 150px;
            opacity: 0.5;
        }

        /* Отрисовка углов */
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 4px solid #fff;
            transition: all 0.3s ease;
        }

        .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 25px; }
        .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 25px; }
        .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 25px; }
        .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 25px; }

        .scan-hint {
            position: absolute;
            bottom: 15%;
            color: #fff;
            font-size: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            pointer-events: all;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="initScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
        <div class="scan-overlay">
            <div id="reticle" class="reticle">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
            <div class="scan-hint">Помести код в центр</div>
        </div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let scanner = null;

        function initScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            scanner = new Html5Qrcode("reader");
            const config = { fps: 25, qrbox: { width: 250, height: 250 } };

            scanner.start({ facingMode: "environment" }, config, (decodedText) => {
                // Эффект захвата
                const reticle = document.getElementById('reticle');
                reticle.classList.add('active');
                
                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                // Небольшая пауза для анимации перед переходом
                setTimeout(() => {
                    window.location.href = decodedText;
                }, 300);
            }).catch(err => {
                console.error(err);
                stopScanner();
            });
        }

        function stopScanner() {
            if (scanner) {
                scanner.stop().then(() => {
                    document.getElementById('scanner-wrapper').style.display = 'none';
                    document.getElementById('main-screen').style.display = 'flex';
                    document.getElementById('reticle').classList.remove('active');
                });
            }
        }
    </script>
</body>
</html>
