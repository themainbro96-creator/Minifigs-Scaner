<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #main-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
        }

        /* Сканер */
        #scanner-container {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Анимированная рамка (только углы) */
        .reticle {
            width: 260px;
            height: 260px;
            position: relative;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6);
        }

        /* Состояние при сканировании (сужение) */
        .reticle.active {
            width: 180px;
            height: 180px;
            border-radius: 20px;
        }

        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 4px solid #fff;
            border-radius: 10px;
        }

        .tl { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 20px; }
        .tr { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 20px; }
        .bl { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 20px; }
        .br { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 20px; }

        .close-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            background: rgba(255,255,255,0.2);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            pointer-events: all;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <button class="btn-main" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-container">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
        <div class="overlay">
            <div id="reticle" class="reticle">
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>
            </div>
        </div>
        <button class="close-btn" onclick="stopScanner()">Закрыть</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const reticle = document.getElementById('reticle');
        let stream = null;
        let isScanning = false;

        async function startScanner() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                
                document.getElementById('main-screen').style.display = 'none';
                document.getElementById('scanner-container').style.display = 'block';
                
                isScanning = true;
                requestAnimationFrame(tick);
            } catch (err) {
                alert("Ошибка доступа к камере: " + err);
            }
        }

        function tick() {
            if (!isScanning) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    onSuccess(code.data);
                    return; // Прекращаем цикл при успехе
                }
            }
            requestAnimationFrame(tick);
        }

        function onSuccess(data) {
            isScanning = false;
            
            // Вибрация
            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            
            // Эффект сужения рамки
            reticle.classList.add('active');
            
            setTimeout(() => {
                window.location.href = data;
            }, 400); // Задержка, чтобы увидеть анимацию
        }

        function stopScanner() {
            isScanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            document.getElementById('scanner-container').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            reticle.classList.remove('active');
        }
    </script>
</body>
</html>
