<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, SF Pro Display, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            content: url('Pics/BlackHolder.PNG'); 
            margin-bottom: 30px;
        }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        /* КОНТЕЙНЕР СКАНЕРА */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
        }

        /* УБИРАЕМ ВСЕ ЛИШНИЕ КВАДРАТЫ И ОСТАВЛЯЕМ ТОЛЬКО ОДИН РОДНОЙ */
        #reader__scan_region {
            border: none !important;
        }

        #reader__scan_region div {
            border: 3px solid #007AFF !important; /* Делаем рамку синей в стиле iOS */
            border-radius: 30px !important;
            box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6) !important;
        }

        /* Убираем кнопку "Stop Scanning" от библиотеки */
        #reader__dashboard_section_csr button {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>Помести QR-код с пакетика в рамку</p>
        <button class="btn-main" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function startScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");

            const qrConfig = {
                fps: 20,
                // Увеличиваем зону поиска для плотных кодов
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    let minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    let size = Math.floor(minEdge * 0.75);
                    return { width: size, height: size };
                },
                aspectRatio: 1.0,
                // Улучшенная обработка для сложных QR
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                }
            };

            html5QrCode.start(
                { facingMode: "environment" },
                qrConfig,
                (decodedText) => {
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    // Останавливаем камеру и переходим
                    html5QrCode.stop().then(() => {
                        window.location.href = decodedText;
                    }).catch(() => {
                        window.location.href = decodedText;
                    });
                }
            ).catch(err => {
                console.error("Scanner Error:", err);
                resetUI();
            });
        }

        function resetUI() {
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
