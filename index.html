<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-button-color: #3C7FFB;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--tg-theme-bg-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .holder-img {
            width: 220px;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG');
        }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 18px 32px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        /* КОНТЕЙНЕР СКАНЕРА */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 1000;
        }

        #reader {
            width: 100% !important;
            height: 100% !important;
        }

        /* ХАК ДЛЯ СТИЛИЗАЦИИ РАМКИ БИБЛИОТЕКИ (iOS STYLE) */
        #reader__scan_region {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Делаем стандартную рамку белой, квадратной и с нашими углами */
        #reader__scan_region div[style*="border"] {
            border: 4px solid #fff !important;
            border-radius: 40px !important;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.6) !important; /* Затемнение вокруг */
            width: 260px !important;
            height: 260px !important;
        }

        /* Убираем лишние кнопки и текст библиотеки */
        #reader__dashboard_section_csr, 
        #reader__dashboard_section_swaplink, 
        #reader__status_span {
            display: none !important;
        }

        video {
            object-fit: cover !important;
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p style="opacity: 0.6; margin-bottom: 40px;">Наведи камеру на QR-код на пакетике</p>
        <button class="btn-main" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <div id="reader"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let html5QrCode = null;

        function startScanner() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            html5QrCode = new Html5Qrcode("reader");

            const config = { 
                fps: 25, 
                qrbox: { width: 260, height: 260 }, // Строго квадратная область
                aspectRatio: 1.0,
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true // Ускоряет скан на новых iOS
                }
            };

            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                (decodedText) => {
                    // Успех! Вибрируем и переходим
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
                    
                    html5QrCode.stop().then(() => {
                        window.location.href = decodedText;
                    }).catch(() => {
                        window.location.href = decodedText;
                    });
                }
            ).catch(err => {
                console.error("Camera error:", err);
                alert("Ошибка камеры. Проверьте разрешения.");
                resetUI();
            });
        }

        function resetUI() {
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
