<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Scanner</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        :root {
            --tg-theme-bg-color: #fff;
            --tg-theme-text-color: #000;
            --tg-theme-button-color: #007aff;
            --tg-theme-button-text-color: #fff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* =========================================
           ГЛАВНЫЙ ЭКРАН (ВОССТАНОВЛЕН ПОЛНОСТЬЮ)
           ========================================= */
        #main-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .holder-img {
            width: 200px;
            height: auto;
            opacity: 0.75;
            margin-bottom: 30px;
            content: url('Pics/BlackHolder.PNG'); 
        }

        h1 { font-size: 24px; font-weight: 600; margin: 0 0 10px; }
        p { font-size: 16px; opacity: 0.6; max-width: 280px; line-height: 1.4; margin: 0 0 40px; }

        .btn-main {
            background-color: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            padding: 16px 32px;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            width: 280px;
            cursor: pointer;
        }

        /* =========================================
           ЭКРАН СКАНЕРА (БЕЗ ЛИШНИХ РАМОК)
           ========================================= */
        #scanner-wrapper {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: #000;
            z-index: 1000;
        }

        #video-preview {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #custom-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }

        /* ВООБЩЕ НЕВИДИМЫЙ КВАДРАТ */
        .scan-frame {
            width: 250px;
            height: 250px;
            border: none !important; /* Полная невидимость */
            border-radius: 30px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.65); /* Затемнение вокруг */
        }

        .scan-text {
            position: absolute;
            bottom: -50px;
            left: 0; width: 100%;
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div id="main-screen">
        <div class="holder-img"></div>
        <h1>Отсканируй код</h1>
        <p>На обратной стороне твоего подарочного пакетика есть QR-код. Отсканируй его!</p>
        <button class="btn-main" onclick="startScanner()">Сканировать</button>
    </div>

    <div id="scanner-wrapper">
        <video id="video-preview" playsinline></video>
        <canvas id="scan-canvas" style="display:none;"></canvas>
        
        <div id="custom-overlay">
            <div class="scan-frame">
                <div class="scan-text">Помести код в центр экрана</div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('scan-canvas');
        const context = canvas.getContext('2d', { willReadFrequently: true });
        let scanning = false;

        async function startScanner() {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            document.getElementById('main-screen').style.display = 'none';
            document.getElementById('scanner-wrapper').style.display = 'block';

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                scanning = true;
                requestAnimationFrame(tick);
            } catch (err) {
                alert("Ошибка доступа к камере. Проверьте настройки.");
                resetUI();
            }
        }

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code) {
                    scanning = false;
                    if (tg.HapticFeedback) {
                        tg.HapticFeedback.notificationOccurred('success');
                    }
                    
                    // Останавливаем камеру
                    video.srcObject.getTracks().forEach(track => track.stop());
                    
                    // Переход по ссылке
                    window.location.href = code.data;
                    return;
                }
            }
            if (scanning) requestAnimationFrame(tick);
        }

        function resetUI() {
            document.getElementById('scanner-wrapper').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
