<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фигурка #1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #3C7FFB; /* Твой синий фон */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
        }

        /* Контейнер фигурки */
        .fig-container {
            width: 80%;
            max-width: 300px;
            margin-bottom: 30px;
            transition: transform 0.5s ease;
        }

        .fig-container img {
            width: 100%;
            height: auto;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.3));
        }

        /* Плашка с характеристиками */
        .info-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 24px;
            width: 85%;
            max-width: 320px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .info-row {
            margin-bottom: 15px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .value {
            font-size: 18px;
            font-weight: 700;
        }

        .highlight {
            color: #00FFD1; /* Яркий акцент для даты */
        }

        /* Анимация появления */
        .fade-in {
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="fig-container fade-in">
        <img src="Pics/fig1.png" alt="Figurine">
    </div>

    <div class="info-card fade-in" style="animation-delay: 0.2s;">
        <div class="info-row">
            <div class="label">Номер:</div>
            <div class="value">#LF-237512-01</div>
        </div>
        
        <div class="info-row">
            <div class="label">Серия:</div>
            <div class="value">JEDI_01SERIES</div>
        </div>

        <div class="info-row">
            <div class="label">Дата доставки:</div>
            <div class="value highlight">25 ФЕВРАЛЯ</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();
    </script>
</body>
</html>
