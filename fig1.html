<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Jedi Collectibles</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-dark-card: rgba(28, 28, 30, 0.85);
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-secondary: #8E8E93;
        }

        body {
            margin: 0;
            background-color: #3C7FFB; /* Твой фирменный синий */
            font-family: -apple-system, SF Pro Display, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Верхняя часть: Галерея */
        .gallery-section {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-scroll {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            scrollbar-width: none;
        }
        .gallery-scroll::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .slide img {
            max-width: 85%;
            max-height: 80%;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.4));
        }

        /* Точки индикации */
        .pagination {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 6px; height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.3s;
        }
        .dot.active {
            background: white;
            transform: scale(1.3);
        }

        /* Нижняя часть: iOS Card */
        .details-card {
            background: var(--ios-dark-card);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border-top: 0.5px solid var(--ios-border);
            border-radius: 28px 28px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.8px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            font-weight: 500;
        }
        .stars { color: #FFD60A; }
        .reviews-count { color: var(--ios-secondary); }

        /* Таблица характеристик */
        .ios-list {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .ios-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--ios-border);
            font-size: 16px;
        }
        .ios-item:last-child { border-bottom: none; }

        .label { color: var(--ios-secondary); font-weight: 400; }
        .value { font-weight: 400; }
        .blue-text { color: var(--ios-blue); font-weight: 600; }

    </style>
</head>
<body>

    <div class="gallery-section">
        <div class="gallery-scroll" id="slider">
            </div>
        <div class="pagination" id="dots"></div>
    </div>

    <div class="details-card">
        <div class="header">
            <h1 id="fig-name">Загрузка...</h1>
            <div class="rating-row">
                <span class="stars">★★★★★</span>
                <span class="reviews-count">12 отзывов</span>
            </div>
        </div>

        <div class="ios-list">
            <div class="ios-item">
                <span class="label">Артикул</span>
                <span class="value" id="fig-id">#000</span>
            </div>
            <div class="ios-item">
                <span class="label">Серия</span>
                <span class="value">JEDI_01</span>
            </div>
            <div class="ios-item">
                <span class="label">Доставка</span>
                <span class="blue-text" id="fig-date">-- фев</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#3C7FFB');

        // --- ДАННЫЕ ДЛЯ РЕДАКТИРОВАНИЯ ---
        // Для fig1.html:
        const config = {
            name: "Стасс Алли",
            id: "#LF-237512-01",
            date: "25 февраля",
            folder: "fig1",
            images: ["1.png", "2.png", "3.png"] // имена файлов в папке
        };

        /* Для fig2.html используй:
        name: "Асока Тано", id: "#LF-237512-02", date: "27 февраля", folder: "fig2"

        Для fig3.html используй:
        name: "Страж Храма", id: "#LF-237512-03", date: "28 февраля", folder: "fig3"
        */

        // Заполнение данных
        document.getElementById('fig-name').innerText = config.name;
        document.getElementById('fig-id').innerText = config.id;
        document.getElementById('fig-date').innerText = config.date;

        // Генерация галереи
        const slider = document.getElementById('slider');
        const dotsContainer = document.getElementById('dots');

        config.images.forEach((imgName, index) => {
            // Слайд
            const slide = document.createElement('div');
            slide.className = 'slide';
            slide.innerHTML = `<img src="${config.folder}/${imgName}">`;
            slider.appendChild(slide);

            // Точка
            const dot = document.createElement('div');
            dot.className = `dot ${index === 0 ? 'active' : ''}`;
            dotsContainer.appendChild(dot);
        });

        // Свайп-логика и вибрация
        let currentIdx = 0;
        slider.addEventListener('scroll', () => {
            const newIdx = Math.round(slider.scrollLeft / window.innerWidth);
            if (newIdx !== currentIdx) {
                currentIdx = newIdx;
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                
                const dots = document.querySelectorAll('.dot');
                dots.forEach((d, i) => d.classList.toggle('active', i === currentIdx));
            }
        });
    </script>
</body>
</html>
