<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Стасс Алли</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF;
            --ios-dark-card: rgba(28, 28, 30, 0.9);
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-secondary: #8E8E93;
        }

        body {
            margin: 0;
            background-color: #3C7FFB;
            font-family: -apple-system, SF Pro Display, sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Галерея */
        .gallery-section {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gallery-scroll {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 100%;
            scrollbar-width: none;
        }
        .gallery-scroll::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .slide img {
            max-width: 85%;
            max-height: 75%;
            object-fit: contain;
            filter: drop-shadow(0 30px 50px rgba(0,0,0,0.4));
        }

        .pagination {
            position: absolute;
            bottom: 25px;
            display: flex;
            gap: 8px;
        }
        .dot {
            width: 6px; height: 6px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .dot.active {
            background: white;
            transform: scale(1.4);
        }

        /* Карточка iOS */
        .details-card {
            background: var(--ios-dark-card);
            backdrop-filter: blur(30px) saturate(160%);
            -webkit-backdrop-filter: blur(30px) saturate(160%);
            border-top: 0.5px solid var(--ios-border);
            border-radius: 30px 30px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3);
        }

        .header { margin-bottom: 22px; }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.8px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
        }
        .stars { color: #FFD60A; }
        .reviews { color: var(--ios-secondary); }

        /* Список характеристик */
        .ios-list {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            overflow: hidden;
        }

        .ios-item {
            display: flex;
            justify-content: space-between;
            padding: 14px 16px;
            border-bottom: 0.5px solid var(--ios-border);
            font-size: 16px;
        }
        .ios-item:last-child { border-bottom: none; }

        .label { color: var(--ios-secondary); }
        .value { font-weight: 400; }
        .blue-text { color: var(--ios-blue); font-weight: 600; }
    </style>
</head>
<body>

    <div class="gallery-section">
        <div class="gallery-scroll" id="slider">
            <div class="slide"><img src="fig1/1.webp"></div>
            <div class="slide"><img src="fig1/2.webp"></div>
            <div class="slide"><img src="fig1/3.webp"></div>
        </div>
        <div class="pagination" id="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="details-card">
        <div class="header">
            <h1>Стасс Алли</h1>
            <div class="rating-row">
                <span class="stars">★★★★★</span>
                <span class="reviews">12 отзывов</span>
            </div>
        </div>

        <div class="ios-list">
            <div class="ios-item">
                <span class="label">Артикул</span>
                <span class="value">#LF-237512-01</span>
            </div>
            <div class="ios-item">
                <span class="label">Серия</span>
                <span class="value">JEDI_01</span>
            </div>
            <div class="ios-item">
                <span class="label">Доставка</span>
                <span class="blue-text">25 февраля</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#3C7FFB');

        const slider = document.getElementById('slider');
        const dots = document.querySelectorAll('.dot');
        let currentIdx = 0;

        slider.addEventListener('scroll', () => {
            const newIdx = Math.round(slider.scrollLeft / window.innerWidth);
            if (newIdx !== currentIdx) {
                currentIdx = newIdx;
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                dots.forEach((d, i) => d.classList.toggle('active', i === currentIdx));
            }
        });
    </script>
</body>
</html>
