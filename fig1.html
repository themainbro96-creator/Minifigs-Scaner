<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фигурка #1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Системные настройки iOS */
        :root {
            --ios-dark-bg: rgba(28, 28, 30, 0.8); /* SystemGray6 с прозрачностью */
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-text-secondary: #8E8E93;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #3C7FFB; /* Твой синий фон */
            font-family: -apple-system, SF Pro Display, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: white;
            -webkit-font-smoothing: antialiased;
        }

        /* Контейнер фигурки */
        .fig-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding-top: 40px;
        }

        .fig-container img {
            max-width: 85%;
            max-height: 320px;
            object-fit: contain;
            /* Тень без блюра для четкости в стиле рендера */
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.4));
        }

        /* Карточка в стиле iOS Dark Mode */
        .info-card {
            background: var(--ios-dark-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 0.5px solid var(--ios-border);
            border-radius: 20px; /* Характерный радиус Apple */
            padding: 0;
            width: calc(100% - 32px);
            max-width: 360px;
            margin-bottom: 50px; /* Отступ от низа экрана */
            overflow: hidden;
        }

        /* Строки таблицы характеристик */
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 0.5px solid var(--ios-border);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .label {
            font-size: 15px;
            color: var(--ios-text-secondary);
            font-weight: 400;
        }

        .value {
            font-size: 16px;
            font-weight: 500;
            text-align: right;
        }

        /* Акцент на доставке в стиле iOS (голубой/зеленый) */
        .highlight {
            color: #32D74B; /* SystemGreen для темной темы */
            font-weight: 600;
        }

    </style>
</head>
<body>

    <div class="fig-container">
        <img src="Pics/fig1.png" alt="Figurine">
    </div>

    <div class="info-card">
        <div class="info-row">
            <span class="label">Номер</span>
            <span class="value">#LF-237512-01</span>
        </div>
        
        <div class="info-row">
            <span class="label">Серия</span>
            <span class="value">JEDI_01SERIES</span>
        </div>

        <div class="info-row">
            <span class="label">Дата доставки</span>
            <span class="value highlight">25 февраля</span>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        // Включаем темную тему для статус-бара ТГ
        tg.setHeaderColor('#3C7FFB'); 
    </script>
</body>
</html>
