<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фигурка #1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --ios-blue: #007AFF; /* Тот самый синий iOS */
            --ios-dark-bg: rgba(28, 28, 30, 0.94);
            --ios-border: rgba(255, 255, 255, 0.1);
            --ios-secondary: #8E8E93;
        }

        body {
            margin: 0;
            background-color: #3C7FFB;
            font-family: -apple-system, SF Pro Display, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Галерея */
        .gallery-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .gallery-container {
            display: flex;
            overflow-x: scroll;
            scroll-snap-type: x mandatory;
            width: 100%;
            height: 80%;
            scrollbar-width: none;
        }

        .gallery-container::-webkit-scrollbar { display: none; }

        .slide {
            flex: 0 0 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .slide img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
        }

        /* Индикаторы (Точки) */
        .dots {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 7px;
            height: 7px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            transition: 0.3s;
        }

        .dot.active {
            background: white;
            transform: scale(1.2);
        }

        /* Контентная часть */
        .content-card {
            background: var(--ios-dark-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 0.5px solid var(--ios-border);
            border-radius: 30px 30px 0 0;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-block h1 {
            font-size: 24px;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.5px;
        }

        .rating {
            color: #FFD60A; /* Цвет звезд iOS */
            font-size: 14px;
            margin-top: 4px;
        }

        /* Таблица характеристик */
        .ios-table {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 0.5px solid var(--ios-border);
            font-size: 15px;
        }

        .info-row:last-child { border-bottom: none; }

        .label { color: var(--ios-secondary); }
        .value { font-weight: 500; }
        .blue-val { color: var(--ios-blue); font-weight: 600; }

    </style>
</head>
<body>

    <div class="gallery-wrapper">
        <div class="gallery-container" id="gallery">
            <div class="slide"><img src="fig1/1.png"></div>
            <div class="slide"><img src="fig2/2.png"></div>
            <div class="slide"><img src="fig3/3.png"></div>
        </div>
        <div class="dots" id="dots">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <div class="content-card">
        <div class="header-row">
            <div class="title-block">
                <h1>Фигурка #1</h1>
                <div class="rating">★★★★★ <span style="color:white; opacity: 0.5; font-size: 12px;">(12 отзывов)</span></div>
            </div>
            <div style="font-size: 20px; font-weight: 700;">$0</div>
        </div>

        <div class="ios-table">
            <div class="info-row">
                <span class="label">ID Предмета</span>
                <span class="value">#LF-237512-01</span>
            </div>
            <div class="info-row">
                <span class="label">Серия</span>
                <span class="value">JEDI_01</span>
            </div>
            <div class="info-row">
                <span class="label">Доставка</span>
                <span class="blue-val">25 февраля</span>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        const gallery = document.getElementById('gallery');
        const dots = document.querySelectorAll('.dot');
        
        tg.expand();
        tg.setHeaderColor('#3C7FFB');

        // Свайпы и вибрация
        let lastIndex = 0;
        gallery.addEventListener('scroll', () => {
            const index = Math.round(gallery.scrollLeft / window.innerWidth);
            if (index !== lastIndex) {
                if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
                dots.forEach(d => d.classList.remove('active'));
                dots[index].classList.add('active');
                lastIndex = index;
            }
        });
    </script>
</body>
</html>
